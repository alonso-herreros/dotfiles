swipe:
  3:
    up:
      command: hyprctl dispatch 'hl.dsp.focus({workspace="previous_per_monitor"})'
    down:
      command: hyprctl dispatch 'hl.dsp.workspace.toggle_special("tmp")'
    left:
      command: hyprctl dispatch 'hl.dsp.send_shortcut({mods="CTRL", key="Tab"})'
    right:
      command: hyprctl dispatch 'hl.dsp.send_shortcut({mods="CTRL+SHIFT", key="Tab"})'
  4:
    up:
      update:
        command:   "~/.scripts/system/volume_ctl.sh -i 5"
        interval:  0.3
        threshold: 0.8
    down:
      update:
        command:   "~/.scripts/system/volume_ctl.sh -d 5"
        interval:  0.3
        threshold: 0.8
    left:
      command: "playerctl next"
    right:
      command: "playerctl previous"

hold:
  # 2:
    # command: "~/.scripts/system/volume_ctl.sh -t"
  3:
    command: "~/.scripts/system/volume_ctl.sh -t"
    # command: "hyprctl dispatch sendshortcut , F5, activewindow"
  4:
    command: "playerctl play-pause"

rotate:
  3:
    clockwise:
      update:
        command: "~/.scripts/system/volume_ctl.sh -i 5"
        interval: 0.8
        threshold: 0.6
    counterclockwise:
      update:
        command: "~/.scripts/system/volume_ctl.sh -d 5"
        interval: 0.8
        threshold: 0.6
  4:
    clockwise:
      update:
        command: "~/.scripts/system/brightness_ctl.sh -n s 10%+"
        interval: 0.8
        threshold: 0.6
    counterclockwise:
      update:
        command: "~/.scripts/system/brightness_ctl.sh -n s 10%-"
        interval: 0.8
        threshold: 0.6

